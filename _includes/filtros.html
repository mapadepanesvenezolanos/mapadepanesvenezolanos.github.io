<style>
  #panes-listado .listing-item[hidden],
  #panes-paginacion[hidden],
  #panes-filtros[hidden] {
    display: none !important;
  }

  /* Botones de filtros */
  .panes-filtros {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin: 24px auto 12px;
    padding: 0 16px;
  }

  .panes-filtros button {
    padding: 10px 18px;
    border: 1px solid #713b32;
    border-radius: 24px;
    background: transparent;
    color: #713b32;
    font: inherit;
    cursor: pointer;
  }

  .panes-filtros button:hover,
  .panes-filtros button[aria-pressed="true"] {
    background: #713b32;
    color: #fff;
  }

  .panes-filtros button:focus-visible,
  #panes-paginacion button:focus-visible {
    outline: 3px solid #713b32;
    outline-offset: 4px;
  }

  /* Contador de resultados */
  .panes-resultado {
    margin: 12px 0 24px;
    text-align: center;
  }

  .panes-resultado:empty {
    display: none;
  }

  /* Reorganización de las tarjetas visibles */
  #panes-listado {
    display: grid !important;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 30px;
    height: auto !important;
  }

  #panes-listado > .listing-item {
    position: relative !important;
    inset: auto !important;
    transform: none !important;
    translate: none !important;
    float: none !important;
    width: 100% !important;
    max-width: none !important;
    min-width: 0;
    margin: 0 !important;
    padding: 0 !important;
  }

  #panes-listado::before,
  #panes-listado::after {
    content: none !important;
    display: none !important;
  }

  /* Paginación */
  #panes-paginacion .pagination {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
    width: 100%;
  }

  #panes-paginacion .pagination__left {
    text-align: left;
  }

  #panes-paginacion .pagination__center {
    text-align: center;
  }

  #panes-paginacion .pagination__right {
    text-align: right;
  }

  #panes-paginacion button {
    border: 0;
    padding: 8px 0;
    background: transparent;
    color: #713b32;
    font: inherit;
    cursor: pointer;
  }

  #panes-paginacion button:hover {
    text-decoration: underline;
  }

  #panes-paginacion button:disabled {
    visibility: hidden;
  }

  @media (max-width: 900px) {
    #panes-listado {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
    }
  }

  @media (max-width: 600px) {
    #panes-listado {
      grid-template-columns: minmax(0, 1fr);
      gap: 24px;
    }
  }

  @media (max-width: 480px) {
    #panes-paginacion .pagination {
      grid-template-columns: 1fr 1fr;
    }

    #panes-paginacion .pagination__center {
      grid-column: 1 / -1;
      grid-row: 1;
    }
  }
</style>

<div
  class="panes-filtros"
  id="panes-filtros"
  role="group"
  aria-label="Filtrar por tipo de pan"
  hidden>

  <button
    type="button"
    data-filtro="todos"
    aria-pressed="true"
    aria-controls="panes-listado">
    Todos
  </button>

  <button
    type="button"
    data-filtro="unicos"
    aria-pressed="false"
    aria-controls="panes-listado">
    Únicos
  </button>

  <button
    type="button"
    data-filtro="rusticos"
    aria-pressed="false"
    aria-controls="panes-listado">
    Semi-rústicos y rústicos
  </button>

  <button
    type="button"
    data-filtro="suaves"
    aria-pressed="false"
    aria-controls="panes-listado">
    Suaves y rellenos
  </button>

  <button
    type="button"
    data-filtro="dulces"
    aria-pressed="false"
    aria-controls="panes-listado">
    Dulces
  </button>

  <button
    type="button"
    data-filtro="heredados"
    aria-pressed="false"
    aria-controls="panes-listado">
    Heredados
  </button>

  <button
    type="button"
    data-filtro="consentidos"
    aria-pressed="false"
    aria-controls="panes-listado">
    Consentidos
  </button>

</div>

<p
  id="panes-resultado"
  class="panes-resultado"
  role="status"
  aria-atomic="true">
</p>

<script>
(() => {
  function iniciarFiltros() {
    const listado = document.getElementById("panes-listado");
    const filtros = document.getElementById("panes-filtros");
    const navegacion = document.getElementById("panes-paginacion");
    const anterior = document.getElementById("panes-anterior");
    const siguiente = document.getElementById("panes-siguiente");
    const indicador = document.getElementById("panes-pagina");
    const resultado = document.getElementById("panes-resultado");

    if (
      !listado ||
      !filtros ||
      !navegacion ||
      !anterior ||
      !siguiente ||
      !indicador ||
      !resultado
    ) {
      console.warn(
        "Filtros de panes: falta el listado o algún control de paginación."
      );
      return;
    }

    // Evita registrar los eventos más de una vez.
    if (filtros.dataset.inicializado === "true") return;

    const tarjetas = Array.from(
      listado.querySelectorAll(".listing-item[data-tipo]")
    );

    const botones = Array.from(
      filtros.querySelectorAll("[data-filtro]")
    );

    // Cantidad de panes por página definida en _config.yml.
    const cantidadConfigurada = Number(
      {{ site.paginate | default: 15 | jsonify }}
    );

    const porPagina =
      Number.isInteger(cantidadConfigurada) && cantidadConfigurada > 0
        ? cantidadConfigurada
        : 15;

    function normalizar(valor) {
      return String(valor || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[-‐‑‒–—_]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    // Las claves corresponden al atributo data-filtro de los botones.
    // Los valores corresponden al campo tipo de los posts.
    const grupos = {
      unicos: [
        "unicos"
      ],

      rusticos: [
        "semi rusticos y rusticos"
      ],

      suaves: [
        "suaves y rellenos"
      ],

      dulces: [
        "dulces"
      ],

      heredados: [
        "heredados"
      ],

      consentidos: [
        "consentidos"
      ]
    };

    // Normaliza ambos lados de la comparación.
    Object.keys(grupos).forEach(clave => {
      grupos[clave] = grupos[clave].map(normalizar);
    });

    const tipos = new Map(
      tarjetas.map(tarjeta => [
        tarjeta,
        normalizar(tarjeta.dataset.tipo)
      ])
    );

    let filtro = "todos";
    let pagina = 1;

    function esFiltroValido(valor) {
      return valor === "todos" ||
        Object.prototype.hasOwnProperty.call(grupos, valor);
    }

    function leerEstadoURL() {
      const parametros = new URLSearchParams(window.location.search);
      const tipoSolicitado = parametros.get("tipo") || "todos";

      filtro = esFiltroValido(tipoSolicitado)
        ? tipoSolicitado
        : "todos";

      // Compatibilidad con /page2/, /page3/, etc.
      const paginaRuta = window.location.pathname.match(
        /\/page(\d+)\/?$/
      );

      const paginaSolicitada = Number(
        parametros.get("pagina") ||
        (paginaRuta ? paginaRuta[1] : 1)
      );

      pagina =
        Number.isSafeInteger(paginaSolicitada) && paginaSolicitada > 0
          ? paginaSolicitada
          : 1;
    }

    function actualizarURL() {
      const url = new URL(window.location.href);

      // Conserva el prefijo del sitio si utiliza baseurl.
      url.pathname = url.pathname.replace(/\/page\d+\/?$/, "/");

      url.searchParams.delete("tipo");
      url.searchParams.delete("pagina");

      if (filtro !== "todos") {
        url.searchParams.set("tipo", filtro);
      }

      if (pagina > 1) {
        url.searchParams.set("pagina", String(pagina));
      }

      window.history.replaceState(null, "", url);
    }

    function mostrar(cambiarURL = false) {
      const seleccionadas = tarjetas.filter(tarjeta => {
        if (filtro === "todos") return true;

        const tiposDelGrupo = grupos[filtro] || [];
        return tiposDelGrupo.includes(tipos.get(tarjeta));
      });

      const cantidad = seleccionadas.length;

      const totalPaginas = Math.max(
        1,
        Math.ceil(cantidad / porPagina)
      );

      pagina = Math.max(1, Math.min(pagina, totalPaginas));

      // Oculta todas las tarjetas antes de mostrar la página elegida.
      tarjetas.forEach(tarjeta => {
        tarjeta.hidden = true;
      });

      const inicio = (pagina - 1) * porPagina;

      seleccionadas
        .slice(inicio, inicio + porPagina)
        .forEach(tarjeta => {
          tarjeta.hidden = false;
        });

      botones.forEach(boton => {
        boton.setAttribute(
          "aria-pressed",
          String(boton.dataset.filtro === filtro)
        );
      });

      const mensaje = cantidad === 0
        ? "No hay panes disponibles en esta categoría."
        : cantidad === 1
          ? "1 pan encontrado"
          : `${cantidad} panes encontrados`;

      resultado.textContent = cantidad > 0
        ? `${mensaje} · Página ${pagina} de ${totalPaginas}`
        : mensaje;

      indicador.textContent = `Página ${pagina} de ${totalPaginas}`;

      anterior.disabled = pagina === 1;
      siguiente.disabled = pagina === totalPaginas;
      navegacion.hidden = totalPaginas <= 1;

      if (cambiarURL) actualizarURL();
    }

    botones.forEach(boton => {
      boton.addEventListener("click", () => {
        const seleccionado = boton.dataset.filtro;

        if (!esFiltroValido(seleccionado)) {
          console.warn("Filtro de panes desconocido:", seleccionado);
          return;
        }

        filtro = seleccionado;
        pagina = 1;
        mostrar(true);
      });
    });

    anterior.addEventListener("click", () => {
      if (anterior.disabled) return;

      pagina--;
      mostrar(true);
    });

    siguiente.addEventListener("click", () => {
      if (siguiente.disabled) return;

      pagina++;
      mostrar(true);
    });

    window.addEventListener("popstate", () => {
      leerEstadoURL();
      mostrar();
    });

    leerEstadoURL();
    mostrar();

    filtros.dataset.inicializado = "true";
    filtros.hidden = false;
  }

  // Espera a que existan las tarjetas y los controles de paginación.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", iniciarFiltros, {
      once: true
    });
  } else {
    iniciarFiltros();
  }
})();
</script>
