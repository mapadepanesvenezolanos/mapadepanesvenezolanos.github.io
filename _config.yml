site: Mapa de Panes Venezolanos

url: 
baseurl: 

collections:
  pages:
    output: true
    permalink: /:name
  posts:
    output: true
    permalink: /panes-venezolanos/:slug
  blog:
    output: true
    permalink: /blog/:slug
  comunidad:
    output: true
    permalink: /comunidad/:slug
  cursos:
    output: true
    permalink: /cursos/:name

defaults:
  -
    scope:
      path: ""
    values:
      layout: "default"
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  -
    scope:
      path: ""
      type: "blog"
    values:
      layout: "post"
  -
    scope:
      path: ""
      type: "comunidad"
    values:
      layout: "comunidad"
  -
    scope:
      path: ""
      type: "cursos"
    values:
      layout: "cursos"
  -
    scope:
      path: "assets/**/*.pdf"
    values:
      sitemap: false

markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge
  
sass:
  style: compressed

plugins:
  - jekyll-paginate
  - jekyll-sitemap

# ----------------------------------
# Paginación de panes
# ----------------------------------

# Cantidad de panes mostrados por página
paginate: 20

# URL para las páginas 2, 3, 4...
paginate_path: "/page:num/"

grid_alignments:
  - top
  - center
  - bottom

home_panes:
  tipos:
    - tipo: "suaves y rellenos"
      limite: 7

    - tipo: "dulces"
      limite: 7
    
    - tipo: "semi-rusticos y rusticos"
      limite: 4

    - tipo: "consentidos"
      limite: 4

    - tipo: "heredados"
      limite: 4

    - tipo: "arepa"
      limite: 1

    - tipo: "masa madre"
      limite: 1

    